name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-14, ubuntu-24.04]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 12.4.2
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - name: Install Linux system dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf libdbus-1-dev pkg-config
      - run: pnpm install --frozen-lockfile
      - run: pnpm release:check
      - run: pnpm check
      - run: pnpm test
      - run: pnpm tauri build --no-bundle

      # The released dmg is universal, so Intel has to keep compiling even
      # though every runner and every dev machine here is Apple Silicon.
      - name: Add the Intel target
        if: runner.os == 'macOS'
        run: rustup target add x86_64-apple-darwin
      - name: Build for Intel Macs
        if: runner.os == 'macOS'
        run: pnpm tauri build --no-bundle --target x86_64-apple-darwin
