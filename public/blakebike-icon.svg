<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" role="img" aria-labelledby="title desc">
  <title id="title">blake.bike</title>
  <desc id="desc">A mountain route crossing the world, framed by an electric lime bicycle wheel.</desc>
  <defs>
    <linearGradient id="surface" x1="112" y1="72" x2="896" y2="944" gradientUnits="userSpaceOnUse">
      <stop stop-color="#263C35"/>
      <stop offset=".55" stop-color="#15231E"/>
      <stop offset="1" stop-color="#0C120F"/>
    </linearGradient>
    <linearGradient id="sky" x1="512" y1="210" x2="512" y2="780" gradientUnits="userSpaceOnUse">
