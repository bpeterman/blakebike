      <stop offset=".58" stop-color="#284740"/>
      <stop offset="1" stop-color="#14251D"/>
    </linearGradient>
    <linearGradient id="lime" x1="260" y1="192" x2="772" y2="838" gradientUnits="userSpaceOnUse">
